<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投票倒數 | 智慧 999+ 擴充版</title>
    <style>
        :root {
            --bg-deep: #050101;
            --organ-red: #4a0404;
            --accent-color: #22d3ee;
            --biolume: rgba(34, 211, 238, 0.4);
            --membrane: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #64748b;
            --up-color: #ff2d55;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', "Microsoft JhengHei", sans-serif; cursor: none; }
        
        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 50%, var(--organ-red) 0%, transparent 85%), linear-gradient(135deg, #050101 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            width: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 10px;
        }

        .cursor-trail {
            position: fixed; width: 6px; height: 6px; background: var(--accent-color); border-radius: 50%; pointer-events: none; z-index: 9999;
            box-shadow: 0 0 10px var(--accent-color); transition: transform 0.1s ease-out, opacity 0.4s ease-out; transform: translate(-50%, -50%);
        }

        .container { position: relative; z-index: 1; width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 15px; }
        
        .info-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; width: 100%; justify-content: center; }
        
        .glass-panel {
            background: rgba(0,0,0,0.7); border: 1px solid var(--membrane); padding: 12px; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px;
            text-align: center; position: relative;
        }

        .panel-label { font-size: 0.6rem; color: var(--text-secondary); letter-spacing: 2px; margin-bottom: 8px; font-weight: 800; }

        .fb-embed-container {
            width: 100%; max-width: 320px; display: flex; justify-content: center;
            background: rgba(255, 255, 255, 0.95); border-radius: 6px; padding: 4px;
        }

        .info-tag-strong { color: var(--accent-color); text-shadow: 0 0 8px var(--biolume); font-size: 1.2rem; margin-top: 4px; font-weight: 900; }

        .header h1 { 
            text-align: center; font-size: clamp(1.2rem, 6vw, 2.5rem); font-weight: 900; letter-spacing: 0.1em; margin: 10px 0;
            background: linear-gradient(to bottom, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 auto; width: 100%; max-width: 600px; }
        .time-card { background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.05); padding: 15px 5px; border-radius: 12px; text-align: center; }
        .time-value { display: block; font-size: clamp(1.8rem, 8vw, 3.5rem); font-weight: 900; color: var(--accent-color); text-shadow: 0 0 15px var(--biolume); }
        .time-label { font-size: 0.5rem; color: #475569; letter-spacing: 2px; font-weight: 800; }

        .insights-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: 10px; }
        .glass-section { 
            background: rgba(10, 5, 5, 0.85); border: 1px solid var(--membrane); padding: 1.2rem; border-radius: 8px; backdrop-filter: blur(15px);
            position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 180px;
        }
        .section-tag { font-size: 0.7rem; color: var(--accent-color); letter-spacing: 1.5px; margin-bottom: 12px; font-weight: 900; border-left: 3px solid var(--accent-color); padding-left: 10px; }
        
        .main-content { 
            font-size: clamp(0.8rem, 2.5vw, 0.95rem); line-height: 1.6; color: #cbd5e1; 
            font-style: italic; flex-grow: 1; transition: opacity 0.3s ease;
        }

        .dice-grid-btn {
            position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.85); border: 1px solid var(--accent-color);
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 10;
        }
        .dice-grid-btn:hover { background: var(--accent-color); transform: rotate(90deg); }
        .dice-grid-btn svg { width: 20px; height: 20px; fill: var(--accent-color); transition: 0.3s; }
        .dice-grid-btn:hover svg { fill: #000; }

        .footer { font-size: 0.5rem; color: #334155; text-align: center; letter-spacing: 2px; margin-top: 20px; }

        @media (max-width: 768px) {
            .insights-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/zh_TW/sdk.js#xfbml=1&version=v21.0"></script>

    <div class="container">
        <div class="info-bar">
            <div class="glass-panel">
                <span class="panel-label">聯絡資訊</span>
                <div class="fb-embed-container">
                    <div class="fb-page" data-href="https://www.facebook.com/teddy3small" data-tabs="" data-width="300" data-height="70" data-small-header="true" data-adapt-container-width="true" data-hide-cover="false" data-show-facepile="false"></div>
                </div>
            </div>
            
            <div class="glass-panel">
                <span class="panel-label">下個目標</span>
                <strong id="next-holiday" class="info-tag-strong">計算中...</strong>
            </div>
        </div>

        <div class="header"><h1>11/28 決策倒數</h1></div>

        <div class="countdown-grid">
            <div class="time-card"><span class="time-value" id="days">--</span><span class="time-label">DAYS</span></div>
            <div class="time-card"><span class="time-value" id="hours">--</span><span class="time-label">HRS</span></div>
            <div class="time-card"><span class="time-value" id="minutes">--</span><span class="time-label">MINS</span></div>
            <div class="time-card"><span class="time-value" id="seconds">--</span><span class="time-label">SECS</span></div>
        </div>

        <div class="insights-row">
            <div class="glass-section">
                <span class="section-tag">系統日誌</span>
                <div id="display-date" class="info-tag-strong" style="font-size: 1.4rem; margin-bottom: 5px;">---</div>
                <div id="display-lunar" style="color: var(--up-color); font-size: 0.9rem; font-weight: 700;">讀取中...</div>
            </div>

            <div class="glass-section">
                <span class="section-tag" id="quote-tag">智慧核心 (0/999+)</span>
                <div class="main-content" id="quote-content">正在同步思想...</div>
                <div class="dice-grid-btn" onclick="getNewQuote()">
                    <svg viewBox="0 0 24 24"><path d="M5 3C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3H5ZM7 7C7.55 7 8 7.45 8 8C8 8.55 7.55 9 7 9C6.45 9 6 8.55 6 8C6 7.45 6.45 7 7 7ZM17 7C17.55 7 18 7.45 18 8C18 8.55 17.55 9 17 9C16.45 9 16 8.55 16 8C16 7.45 16.45 7 17 7ZM12 11C12.55 11 13 11.45 13 12C13 12.55 12.55 13 12 13C11.45 13 11 12.55 11 12C11 11.45 11.45 11 12 11ZM7 15C7.55 15 8 15.45 8 16C8 16.55 7.55 17 7 17C6.45 17 6 16.55 6 16C6 15.45 6.45 15 7 15ZM17 15C17.55 15 18 15.45 18 16C18 16.55 17.55 17 17 17C16.45 17 16 16.55 16 16C16 15.45 16.45 15 17 15Z"/></svg>
                </div>
            </div>
        </div>
        <div class="footer">INTERFACE V45.0 · HOLIDAY ENGINE FIXED · STABLE</div>
    </div>

    <script>
        const wisdomNodes = {
            philosophy: [
                "歷史不會爬行，它會跳躍。——《黑天鵝》", "最重要的東西往往是看不見的。——《小王子》",
                "世界是一本書，而不旅行的人只讀了其中一頁。——《聖奧古斯丁》", "吾心信其可行，則移山填海之難，終有成功之日。——《孫文》",
                "上善若水。水善利萬物而不爭。——《老子》", "人如果不為理想而活，那跟鹹魚有什麼分別？——《少林足球》",
                "未經審視的人生是不值得活的。——《蘇格拉底》", "生活在陰溝裡，但仍有人仰望星空。——《王爾德》"
            ],
            antifragile: [
                "你要當一個能在亂局中獲益的人。——《反脆弱》", "殺不死我的，使我更強大。——《尼采》",
                "風險不在於你做了什麼，而在於你不了解什麼。——《巴菲特》", "混亂不是深淵，混亂是階梯。——《權力的遊戲》",
                "真正的勇敢不是不害怕，而是帶著恐懼前行。", "在風暴中建立你的系統，而不是尋找避風港。"
            ],
            growth: [
                "決定你成就的不是你的目標，而是你的系統。——《原子習慣》", "比昨天的自己進步 1%，一年後你會強大 37 倍。",
                "如果你想擁有一些你從未擁有的東西，你必須做一些你從未做過的事。", "專注於過程，結果會自行到來。",
                "複利是世界第八大奇蹟。——《愛因斯坦》", "當你停止學習，你就開始死亡。"
            ],
            stoic: [
                "我們常常受困於想像，多於受困於現實。——《塞內卡》", "你無法控制天氣，但你可以調整心情。",
                "如果你感到痛苦，那是因為你的判斷，而非事情本身。", "專注於你可以控制的事，接受你無法控制的事。"
            ]
        };

        function generateWisdom() {
            const categories = Object.keys(wisdomNodes);
            const cat = categories[Math.floor(Math.random() * categories.length)];
            const list = wisdomNodes[cat];
            let base = list[Math.floor(Math.random() * list.length)];
            const modifiers = ["記住：", "深刻體悟：", "時刻提醒自己：", "反思：", "今日核心：", "來自系統的啟示：", "古老智慧：", "邏輯斷言："];
            const prefix = Math.random() > 0.7 ? modifiers[Math.floor(Math.random() * modifiers.length)] : "";
            return prefix + base;
        }

        let currentQuoteCount = 0;
        function getNewQuote() {
            const content = document.getElementById('quote-content');
            content.style.opacity = 0;
            setTimeout(() => {
                content.innerText = `「${generateWisdom()}」`;
                content.style.opacity = 1;
                currentQuoteCount = (currentQuoteCount + 1) % 1000;
                document.getElementById('quote-tag').innerText = `智慧核心 (${currentQuoteCount}/999+)`;
            }, 300);
        }

        const targetDate = new Date(`2026-11-28T00:00:00`);

        // 節日清單及其精準計算
        const holidays = [
            { name: "元旦", m: 1, d: 1 },
            { name: "春節", m: 1, d: 29 }, 
            { name: "和平紀念日", m: 2, d: 28 },
            { name: "兒童節", m: 4, d: 4 },
            { name: "清明節", m: 4, d: 5 },
            { name: "端午節", m: 6, d: 19 },
            { name: "中秋節", m: 10, d: 6 },
            { name: "國慶日", m: 10, d: 10 }
        ];

        function updateUI() {
            const now = new Date();
            const diff = targetDate - now;
            
            if (diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff/86400000).toString().padStart(2,'0');
                document.getElementById('hours').innerText = Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
                document.getElementById('minutes').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                document.getElementById('seconds').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            }

            const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            document.getElementById('display-date').innerText = `${now.getMonth()+1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
            try { 
                document.getElementById('display-lunar').innerText = `農曆節氣同步: ${new Intl.DateTimeFormat('zh-TW-u-ca-chinese', { day: 'numeric', month: 'long' }).format(now)}`; 
            } catch(e){}

            // 修正節日計算邏輯
            let nextHoliday = null;
            let minDiff = Infinity;

            holidays.forEach(h => {
                let hDate = new Date(now.getFullYear(), h.m - 1, h.d);
                // 如果該節日今年已過，計算明年的日期
                if (hDate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
                    hDate.setFullYear(now.getFullYear() + 1);
                }
                
                let timeDiff = hDate - now;
                if (timeDiff < minDiff) {
                    minDiff = timeDiff;
                    nextHoliday = { name: h.name, date: hDate };
                }
            });

            if (nextHoliday) {
                const daysLeft = Math.ceil(minDiff / (1000 * 60 * 60 * 24));
                document.getElementById('next-holiday').innerText = `${nextHoliday.name} (${daysLeft === 0 ? "今日" : daysLeft + "D"})`;
            }
        }

        window.onload = () => {
            updateUI();
            setInterval(updateUI, 1000);
            getNewQuote();
            
            document.addEventListener('mousemove', (e) => {
                const p = document.createElement('div');
                p.className = 'cursor-trail'; p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
                document.body.appendChild(p);
                setTimeout(() => { p.style.opacity = '0'; setTimeout(() => p.remove(), 400); }, 50);
            });
        };
    </script>
</body>
</html>
